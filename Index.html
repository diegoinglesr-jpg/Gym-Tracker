  if(t.dataset.pf!==undefined){PL();const i=t.dataset.pf;(S.plan[i]=S.plan[i]||{t:'',ex:[]}).t=t.value;save();return}
  if(t.dataset.pe){const q=t.dataset.pe.split('.'),x=PL()[q[0]].ex[+q[1]];x[+q[2]]=+q[2]===3?(isNaN(v)?null:v):t.value;rx();save();return}

      if(num(v))S.bw[w]={lb:v,d:box.value||iso(T0)};else delete S.bw[w];
    }else if(S.bw[w]&&t.value){S.bw[w].d=t.value}

});

async function connect(){
  try{
    if(typeof claude==='undefined')return;
    const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!u||!d)return;
    const id=await u.id();if(!id)return;
    DBH=d;UID=id;metaSync();if(!CUR)return;if(unsub){try{unsub()}catch(e){}unsub=null}ref=d.doc('data/users/'+id+'/'+dname(CUR));
    const timer=setTimeout(()=>{},10000);
    const myRef=ref;unsub=ref.onSnapshot(s=>{if(ref!==myRef)return;
      if(s.metadata&&s.metadata.hasPendingWrites)return;
      clearTimeout(timer);
      if(s.exists){
        const v=s.data();
        if(v&&v.lifts&&v.bw&&!tm&&(S.ts||0)>(v.ts||0)){ref.set(cl()).catch(()=>{})}else if(v&&v.lifts&&v.bw&&!tm&&!dirty&&((v.ts||0)>(S.ts||0)||!synced)){
          S=JSON.parse(JSON.stringify({lifts:v.lifts,bw:v.bw,att:v.att||{},plan:v.plan?(typeof v.plan==='string'?JSON.parse(v.plan):v.plan):null,lock:!!v.lock,prof:v.prof||{},done:v.done||{},view:v.view||'l',theme:v.theme||'',strict:!!v.strict,tipX:!!v.tipX,ms:v.ms||{},ph:v.ph||{},sets:v.sets||{},pr:v.pr||{},sug:v.sug||{},rest:v.rest||{},restDef:v.restDef||0,fd:v.fd||{},goal:v.goal||null,ts:v.ts||0}));rx();applyTheme();
          try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
          if(!document.activeElement||document.activeElement.tagName!=='INPUT')render();
        }
      }else if(hasLocal){ref.set(cl()).catch(()=>{})}
      synced=true;const f=$('#foot');if(f)f.textContent='Se guarda solo · sincronizado en tu cuenta';const tb=$('.tip');if(tb)tb.remove();
    },()=>{});
  }catch(e){}
}
